name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # TODO: troque pelo seu slug, o começo do seu e-mail com ponto virando hífen.
  SLUG: mykael-bruno
  # TODO: a primeira porta da sua faixa. Veja em `gr-docker ajuda`.
  PORTA: 23240

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          for container in front api banco; do
            ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
              "gr-docker rm $container" || true
          done

      - name: Criar rede e volume
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker network create web" || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker network create dados --interna" || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker volume create pgdata" || true

      - name: Subir banco, API e front
        run: |
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker run postgres:17-alpine \
              --name banco \
              -v pgdata:/var/lib/postgresql/data \
              -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
              --network dados"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker run gr-atv2-api:1 \
              --name api \
              -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco \
              -e POSTGRES_DB=pokedex \
              -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} \
              --network dados"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker network connect web api"

          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org \
            "gr-docker run gr-atv2-front:1 \
              --name front \
              -p ${{ env.PORTA }}:80 \
              -e API=gr-${{ env.SLUG }}-api \
              -e DEPLOY_SHA=${{ github.sha }} \
              --network web"

      - name: Conferir que subiu
        run: |
          curl -f http://gr.lab.ayty.org:${{ env.PORTA }}/api/pokemons
